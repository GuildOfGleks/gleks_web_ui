<section class="detail">
  <div class="detail__hero card">
    <p class="eyebrow">gog-checkbox</p>
    <h2>Checkbox</h2>
    <p class="lead">
      A two-way bindable checkbox with a `ControlValueAccessor` implementation and a
      customizable check icon slot.
    </p>
  </div>

  <article class="card">
    <h3>States</h3>
    <div class="checkbox-grid">
      <div class="checkbox-group">
        <h4 class="checkbox-group__title">Default</h4>
        <gog-checkbox label="Unchecked" [(checked)]="subscribeNewsletter" />
        <gog-checkbox label="Checked" [(checked)]="acceptTerms" />
        <gog-checkbox label="Indeterminate" [indeterminate]="true" />
      </div>

      <div class="checkbox-group">
        <h4 class="checkbox-group__title">Disabled</h4>
        <gog-checkbox label="Disabled unchecked" [disabled]="true" />
        <gog-checkbox label="Disabled checked" [checked]="disabledChecked()" [disabled]="true" />
        <gog-checkbox
          label="Disabled indeterminate"
          [indeterminate]="true"
          [disabled]="true"
        />
      </div>

      <div class="checkbox-group">
        <h4 class="checkbox-group__title">Sizes</h4> 
        <gog-checkbox label="Small" size="sm" [(checked)]="triState" />
        <gog-checkbox label="Medium" size="md" [checked]="true" />
        <gog-checkbox label="Large" size="lg" [indeterminate]="true" />
      </div>
    </div>
    <p class="meta">{{ summary() }}</p>
  </article>
</section>
