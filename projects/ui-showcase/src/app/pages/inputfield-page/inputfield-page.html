<section class="detail">
  <div class="detail__hero card">
    <p class="eyebrow">gog-inputfield</p>
    <h2>Inputfield</h2>
    <p class="lead">
      A labeled text field with leading/trailing icon slots, error message support, and
      `ControlValueAccessor` integration.
    </p>
  </div>

  <article class="card">
    <h3>Playground</h3>
    <div class="field-grid">
      <gog-inputfield
        label="Name"
        inputId="name"
        iconStart="check"
        [(value)]="name"
      />

      <gog-inputfield
        label="Email"
        inputId="email"
        type="email"
        placeholder="you@example.com"
        errorMessage="Email is required"
        [(value)]="email"
      />

      <gog-inputfield
        label="Password"
        inputId="password"
        type="password"
        [(value)]="password"
      />
    </div>
  </article>
</section>
