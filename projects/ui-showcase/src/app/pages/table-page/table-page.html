<section class="detail">
  <div class="detail__hero card">
    <p class="eyebrow">gog-table</p>
    <h2>Table</h2>
    <p class="lead">
      A sortable, paginated data table with custom cell templates, loading states, and built-in
      row numbers.
    </p>
  </div>

  <article class="card">
    <h3>Showcase</h3>
    <div class="action-row">
      <gog-button variant="primary" type="button" (gogClick)="toggleLoading()">
        Toggle loading
      </gog-button>
    </div>

    <gog-table
      [value]="rows"
      [pageSize]="3"
      [loading]="loading()"
      [showTotal]="true"
      [showRowNumbers]="true"
      [showColumnBorders]="true"
      size="md"
    >
      <column field="component" header="Component" [sortable]="true"></column>
      <column field="status" header="Status" [sortable]="true"></column>
      <column field="owner" header="Owner"></column>
      <column field="updated" header="Updated"></column>
    </gog-table>
  </article>
</section>
