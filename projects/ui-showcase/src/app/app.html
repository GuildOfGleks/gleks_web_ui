<div class="shell">
  <header class="shell__bar">
    <a class="shell__name" routerLink="/"><code>&#64;guildofgleks/ui</code> showcase</a>
    <div class="shell__switches">
      <gog-select
        size="sm"
        ariaLabel="Theme"
        [options]="themeOptions"
        [value]="theme()"
        [fullWidth]="false"
        (valueChange)="setTheme($event)"
      />
      <gog-toggle size="sm" label="RTL" [(checked)]="settings.rtl" />
      <gog-toggle size="sm" label="Hit areas" [(checked)]="settings.hitAreas" />
      <gog-toggle
        size="sm"
        label="Ripple (reloads)"
        [checked]="settings.ripple"
        (checkedChange)="settings.setRipple($event)"
      />
    </div>
  </header>

  <nav class="shell__nav" aria-label="Showcase">
    <a
      class="shell__link"
      routerLink="/"
      routerLinkActive="shell__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Overview</a
    >

    @for (group of groups; track group.group) {
      <p class="shell__group">{{ group.label }}</p>
      @for (row of group.units; track row.unit.id) {
        @if (row.page) {
          <a
            class="shell__link"
            [routerLink]="['/', row.unit.id]"
            routerLinkActive="shell__link--active"
            >{{ row.unit.name }}</a
          >
        } @else {
          <span class="shell__link shell__link--pending">{{ row.unit.name }}</span>
        }
      }
    }

    <p class="shell__group">Legacy</p>
    @for (path of legacyPaths; track path) {
      <a
        class="shell__link shell__link--legacy"
        [routerLink]="['/legacy', path]"
        routerLinkActive="shell__link--active"
        >{{ path }}</a
      >
    }
  </nav>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
