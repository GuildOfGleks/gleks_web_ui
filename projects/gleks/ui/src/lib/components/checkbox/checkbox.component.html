<label class="gog-checkbox gog-contained-layout" [class.gog-checkbox--disabled]="isDisabled()">
  <input
    class="gog-checkbox__input"
    type="checkbox"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
  />

  <span class="gog-checkbox__box gog-inline-center" [class.gog-checkbox__box--checked]="checked()">
    @if (checked()) {
      <gog-icon [template]="checkIconTemplate()" name="check" />
    }
  </span>

  @if (label()) {
    <span class="gog-checkbox__label font-body">{{ label() }}</span>
  }
</label>
