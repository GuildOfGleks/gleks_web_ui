<button
  (click)="onClick($event)"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-disabled]="isDisabled() && !isNativeDisabled() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="ariaPressed()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  [attr.aria-haspopup]="ariaHasPopup()"
  [attr.disabled]="isNativeDisabled() ? true : null"
  [class.gog-btn--ghost]="variant() === 'ghost'"
  [class.gog-btn--loading]="loading()"
  [class.gog-btn--outline]="variant() === 'outline'"
  [class.gog-btn--primary]="variant() === 'primary'"
  [class.gog-btn--secondary]="variant() === 'secondary'"
  [class.gog-cursor-not-allowed]="isDisabled()"
  [class.gog-cursor-pointer]="!isDisabled()"
  [class.gog-cursor-wait]="loading()"
  [type]="type()"
  class="gog-btn gog-inline-center gog-contained-layout"
  [class]="stateClasses()"
  gogRipple
  [rippleDisabled]="!rippleEnabled()"
>
  @if (loading()) {
    <gog-spinner [size]="spinnerSize()" aria-hidden="true" class="gog-btn__spinner" />
  }

  <span [class.gog-btn__content--hidden]="loading()" class="gog-btn__content">
    <ng-content></ng-content>
  </span>
</button>
