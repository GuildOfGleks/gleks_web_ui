<div
  class="gog-toast"
  [class.gog-toast--paused]="isPaused()"
  [class.gog-toast--success]="toast().type === 'success'"
  [class.gog-toast--error]="toast().type === 'error'"
  [class.gog-toast--warning]="toast().type === 'warning'"
  [class.gog-toast--info]="toast().type === 'info'"
  [class.gog-toast--visible]="visible()"
  [style.--toast-duration]="toast().duration + 'ms'"
  (mouseenter)="pauseAutoDismiss()"
  (mouseleave)="resumeAutoDismiss()"
  (transitionend)="onTransitionEnd($event)"
>
  <div class="gog-toast__content">
    <span class="gog-toast__icon" aria-hidden="true">
      <gog-icon [template]="toast().iconTemplate ?? null" [name]="toast().iconName" />
    </span>
    <div class="gog-toast__main">
      <span class="gog-toast__message font-body">{{ toast().message }}</span>
      @if (hasActions()) {
        <div class="gog-toast__actions">
          @for (action of toast().actions; track action.label) {
            <gog-button
              class="gog-toast__action"
              variant="ghost"
              size="sm"
              type="button"
              (gogClick)="runAction(action)"
            >
              @if (action.iconName || action.iconTemplate) {
                <gog-icon [template]="action.iconTemplate ?? null" [name]="action.iconName ?? 'check'" />
              }
              {{ action.label }}
            </gog-button>
          }
        </div>
      }
    </div>
    <gog-button
      class="gog-toast__close"
      variant="ghost"
      size="sm"
      type="button"
      aria-label="Close toast"
      (gogClick)="close()"
    >
      <gog-icon name="close" />
    </gog-button>
  </div>
  @if (!toast().isSticky) {
    <span #progress class="gog-toast__progress" aria-hidden="true"></span>
  }
</div>
