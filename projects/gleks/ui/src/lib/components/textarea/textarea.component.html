<div
  class="gog-input-wrapper gog-contained-layout"
  [class]="sizeClass()"
  [class.gog-input-wrapper--float-in]="resolvedFloatLabel() === 'in'"
  [class.gog-input-wrapper--float-on]="resolvedFloatLabel() === 'on'"
  [class.gog-input-wrapper--float-over]="resolvedFloatLabel() === 'over'"
  [class.gog-input-wrapper--floated]="isFloatLabelFloated()"
>
  @if (label() && resolvedFloatLabel() === 'none') {
    <label class="gog-input__label" [attr.for]="inputId() || null">{{ label() }}</label>
  }
  <div
    class="gog-input__field-container"
    [class.gog-input__field-container--resizable]="resolvedResize() !== 'none' && !isDisabled()"
    [style.--gog-textarea-resize-inset-right.px]="resizeInsetRight()"
    [style.--gog-textarea-resize-inset-bottom.px]="resizeInsetBottom()"
  >
    @if (label() && isFloatLabelActive()) {
      <label class="gog-input__label gog-input__label--float" [attr.for]="inputId() || null">{{
        label()
      }}</label>
    }
    <textarea
      #field
      class="gog-input__field gog-textarea__field"
      [class.gog-input__field--error]="hasError()"
      [class.gog-textarea__field--resize-vertical]="resolvedResize() === 'vertical'"
      [class.gog-textarea__field--resize-horizontal]="resolvedResize() === 'horizontal'"
      [class.gog-textarea__field--resize-both]="resolvedResize() === 'both'"
      [class.gog-textarea__field--resize-none]="resolvedResize() === 'none'"
      [attr.id]="inputId() || null"
      [attr.name]="name() || null"
      [placeholder]="effectivePlaceholder()"
      [rows]="rows()"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="hasError()"
      [attr.aria-describedby]="hasError() && inputId() ? inputId() + '-error' : null"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    ></textarea>
    @if (showClear()) {
      <button
        type="button"
        class="gog-input__clear gog-textarea__clear gog-inline-center"
        [style.--gog-textarea-scrollbar-width.px]="scrollbarWidth()"
        [attr.aria-label]="clearAriaLabel()"
        (click)="clearValue($event)"
      >
        <gog-icon name="close" />
      </button>
    }
  </div>
  @if (visibleError()) {
    <span
      class="gog-input__error"
      [attr.id]="inputId() ? inputId() + '-error' : null"
      role="alert"
      >{{ visibleError() }}</span
    >
  }
</div>
