<!--
  Three parts always rendered; the stylesheet collapses the label and the trailing rule to a
  single continuous line when nothing was projected (`:has(.gog-divider__label:empty)`).
  Written this way so `<gog-divider />` and `<gog-divider>OR</gog-divider>` need no extra input
  to tell them apart.
-->
<span class="gog-divider__rule gog-divider__rule--start" aria-hidden="true"></span>
<span class="gog-divider__label"><ng-content></ng-content></span>
<span class="gog-divider__rule gog-divider__rule--end" aria-hidden="true"></span>
