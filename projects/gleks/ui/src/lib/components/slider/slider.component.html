<div
  class="gog-slider gog-contained-layout"
  [class.gog-slider--disabled]="isFullyDisabled()"
  [class.gog-slider--thumb-hidden]="!showThumb()"
  [class.gog-slider--vertical]="isVertical()"
  [class.gog-slider--range]="range()"
>
  <div class="gog-slider__header">
    @if (label()) {
      <label [attr.for]="range() ? null : inputId" class="gog-slider__label">{{ label() }}</label>
    }

    @if (showValue()) {
      <span class="gog-slider__value">{{ range() ? rangeDisplayValue() : clampedValue() }}</span>
    }
  </div>

  <div class="gog-slider__track-container">
    <div class="gog-slider__track">
      <div class="gog-slider__fill"></div>
    </div>

    @if (showThumb()) {
      @if (range()) {
        <div
          class="gog-slider__thumb gog-slider__thumb--start"
          [class.gog-slider__thumb--disabled]="isStartDisabled()"
          aria-hidden="true"
        ></div>
        <div
          class="gog-slider__thumb gog-slider__thumb--end"
          [class.gog-slider__thumb--disabled]="isEndDisabled()"
          aria-hidden="true"
        ></div>
      } @else {
        <div class="gog-slider__thumb" aria-hidden="true"></div>
      }
    }

    @if (range()) {
      <!--
        Both inputs' `min`/`max` stay pinned to the slider's own global min()/max(), even
        though each thumb can't actually reach past the other one (enforced in
        onRangeStart/EndInput instead). Narrowing a native input's own `min`/`max` attribute
        to the other thumb's value would seem like free crossing-prevention, but it also
        shifts where the browser positions that input's own (invisible) native thumb inside
        its box — off of the box's own start()/end() percentage that --range-start-pos /
        --range-end-pos and this file's custom thumb divs use, so the two would drift apart
        and the real, clickable native thumb would stop lining up with what's drawn on
        screen. `aria-valuemin`/`aria-valuemax` below are fine to narrow dynamically —
        they're just announced text, not something the browser positions anything from.
      -->
      <input
        [id]="inputId"
        class="gog-slider__input gog-slider__input--start"
        type="range"
        [attr.aria-label]="startInputAriaLabel()"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="clampedRange().end"
        [attr.aria-valuenow]="clampedRange().start"
        [attr.aria-invalid]="hasError()"
        [attr.aria-describedby]="errorId()"
        [attr.aria-orientation]="isVertical() ? 'vertical' : null"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="clampedRange().start"
        [disabled]="isStartDisabled()"
        (input)="onRangeStartInput($event)"
        (blur)="onBlur()"
      />
      <input
        class="gog-slider__input gog-slider__input--end"
        type="range"
        [attr.aria-label]="endInputAriaLabel()"
        [attr.aria-valuemin]="clampedRange().start"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="clampedRange().end"
        [attr.aria-invalid]="hasError()"
        [attr.aria-describedby]="errorId()"
        [attr.aria-orientation]="isVertical() ? 'vertical' : null"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="clampedRange().end"
        [disabled]="isEndDisabled()"
        (input)="onRangeEndInput($event)"
        (blur)="onBlur()"
      />
    } @else {
      <input
        [id]="inputId"
        class="gog-slider__input"
        type="range"
        [attr.aria-label]="label() ? null : ariaLabel() || 'Slider'"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="clampedValue()"
        [attr.aria-invalid]="hasError()"
        [attr.aria-describedby]="errorId()"
        [attr.aria-orientation]="isVertical() ? 'vertical' : null"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="clampedValue()"
        [disabled]="isDisabled()"
        (input)="onInput($event)"
        (blur)="onBlur()"
      />
    }
  </div>

  <div class="gog-slider__range-labels">
    <span>{{ min() }}</span>
    <span>{{ max() }}</span>
  </div>

  @if (hasError()) {
    <span class="gog-slider__error" [attr.id]="errorId()" role="alert">
      {{ visibleError() }}
    </span>
  }
</div>
