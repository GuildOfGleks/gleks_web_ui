<!--
  The panel lives in a template because `GogDropdownOverlay` stamps it into `<body>`, never in
  place — see the class comment for why a menu has no in-place mode.

  `<ng-content>` sits inside that template on purpose: the consumer's items exist as soon as
  their own view does, and stamping the panel is what attaches them — so a closed menu puts
  nothing in the accessibility tree, rather than hiding it with CSS.
-->
<ng-template #panelTpl>
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- the panel is the menu container, not a control: its (keydown) drives roving focus between the items, and they are the focusable elements -->
  <div
    [id]="menuId"
    class="gog-menu"
    [class.gog-menu--up]="placement()?.direction === 'up'"
    [style.top.px]="placement()?.top"
    [style.left.px]="placement()?.left"
    [style.max-height.px]="placement()?.maxHeight"
    [style.z-index]="panelZIndex()"
    role="menu"
    [attr.aria-label]="ariaLabel() || null"
    (keydown)="onPanelKeydown($event)"
    (click)="onPanelClick($event)"
  >
    <!--
      The library's own scroller rather than `overflow: auto`: a menu long enough to scroll gets
      the same thin, auto-hiding scrollbar as every other scrollable surface in the package, and
      `overscrollBehavior="contain"` stops a wheel at the end of the list from scrolling the page
      behind the menu. `focusable` is off because the menu's only tab stop is its trigger — items
      are reached with the arrow keys, and `focusElement()` scrolls them into view.
    -->
    <gog-scroll
      class="gog-menu__scroll"
      size="thin"
      [focusable]="false"
      overscrollBehavior="contain"
    >
      <ng-content />
    </gog-scroll>
  </div>
</ng-template>
