<div
  class="gog-scroll"
  [class.gog-scroll--thin]="resolvedSize() === 'thin'"
  [class.gog-scroll--v]="axis() !== 'horizontal'"
  [class.gog-scroll--h]="axis() !== 'vertical'"
  [class.gog-scroll--both]="axis() === 'both'"
  [class.gog-scroll--dragging]="dragAxis() !== null"
>
  <div
    #viewport
    class="gog-scroll__viewport"
    [style.overflow-y]="viewportOverflowY()"
    [style.overflow-x]="viewportOverflowX()"
    [style.overscroll-behavior-y]="viewportOverscrollY()"
    [style.overscroll-behavior-x]="viewportOverscrollX()"
    [attr.tabindex]="focusable() ? 0 : null"
    [attr.role]="focusable() ? 'region' : null"
    [attr.aria-label]="focusable() && ariaLabel() ? ariaLabel() : null"
    (scroll)="onScroll()"
    (pointerenter)="onActivity()"
    (pointermove)="onActivity()"
  >
    <div #content class="gog-scroll__content">
      <ng-content />
    </div>
  </div>

  @if (resolvedShowTrack() && showTrackV()) {
    <div
      class="gog-scroll__track gog-scroll__track--v"
      [class.gog-scroll__track--visible]="
        !resolvedAutoHide() || interacting() || dragAxis() === 'vertical'
      "
      (pointerdown)="onTrackPointerDown($event, 'vertical')"
    >
      <div
        class="gog-scroll__thumb gog-scroll__thumb--v"
        [class.gog-scroll__thumb--active]="dragAxis() === 'vertical'"
        [style.height.%]="thumbSizeV()"
        [style.top.%]="thumbPosV()"
        (pointerdown)="onThumbPointerDown($event, 'vertical')"
        (pointermove)="onThumbPointerMove($event, 'vertical')"
        (pointerup)="onThumbPointerUp($event)"
        (pointercancel)="onThumbPointerUp($event)"
      ></div>
    </div>
  }

  @if (resolvedShowTrack() && showTrackH()) {
    <div
      class="gog-scroll__track gog-scroll__track--h"
      [class.gog-scroll__track--visible]="
        !resolvedAutoHide() || interacting() || dragAxis() === 'horizontal'
      "
      (pointerdown)="onTrackPointerDown($event, 'horizontal')"
    >
      <div
        class="gog-scroll__thumb gog-scroll__thumb--h"
        [class.gog-scroll__thumb--active]="dragAxis() === 'horizontal'"
        [style.width.%]="thumbSizeH()"
        [style.left.%]="thumbPosH()"
        (pointerdown)="onThumbPointerDown($event, 'horizontal')"
        (pointermove)="onThumbPointerMove($event, 'horizontal')"
        (pointerup)="onThumbPointerUp($event)"
        (pointercancel)="onThumbPointerUp($event)"
      ></div>
    </div>
  }

  @if (resolvedShowTrack() && axis() === 'both' && showTrackV() && showTrackH()) {
    <div class="gog-scroll__corner" aria-hidden="true"></div>
  }
</div>
