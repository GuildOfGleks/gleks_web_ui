@for (dialog of dialogService.dialogs(); track trackDialog($index, dialog)) {
  <div
    class="gog-dialog__backdrop"
    [class.gog-dialog__backdrop--modal]="dialog.config.modal !== false"
    [style.z-index]="panelZ(dialog)"
    (pointerdown)="onBackdropPointerDown($event, dialog)"
    (pointerup)="onBackdropPointerUp($event, dialog)"
    (pointercancel)="onBackdropPointerUp($event, dialog)"
  >
    <div
      #panel
      class="gog-dialog__panel"
      [attr.data-dialog-id]="dialog.id"
      [style.--gog-dropdown-z]="panelZ(dialog) + 10"
      [style.--gog-tooltip-z]="panelZ(dialog) + 20"
      [style.--gog-dialog-offset-x]="dialog.offsetX + 'px'"
      [style.--gog-dialog-offset-y]="dialog.offsetY + 'px'"
      [style.width]="dialog.config.width ?? 'auto'"
      [style.max-width]="dialog.config.maxWidth ?? '90vw'"
      [attr.role]="dialog.config.role ?? 'dialog'"
      [attr.aria-modal]="dialog.config.modal === false ? null : 'true'"
      tabindex="-1"
      [attr.aria-labelledby]="dialog.config.title ? getTitleId(dialog) : null"
      (keydown)="onPanelKeydown($event, dialog, panel)"
    >
      @if (dialog.config.title || dialog.config.closable !== false) {
        <div
          class="gog-dialog__header"
          [class.gog-dialog__header--draggable]="isDraggable(dialog)"
          (pointerdown)="startDrag($event, dialog)"
        >
          @if (dialog.config.title) {
            <h2 [id]="getTitleId(dialog)" class="gog-dialog__title">
              {{ dialog.config.title }}
            </h2>
          }
          @if (dialog.config.closable !== false) {
            <button
              type="button"
              class="gog-dialog__close gog-inline-center"
              [attr.aria-label]="closeLabel(dialog)"
              (click)="close(dialog)"
            >
              <gog-icon
                [template]="dialog.config.closeIconTemplate ?? null"
                [name]="dialog.config.closeIconName ?? 'close'"
              />
            </button>
          }
        </div>
      }

      <div class="gog-dialog__body">
        <!--
          Not a tab stop: the panel runs its own focus trap over the projected content
          (onPanelKeydown), keyed to a fixed focusable-element selector. Leaving this
          focusable would insert an extra stop ahead of that content and change which
          element the trap treats as "first".
        -->
        <gog-scroll
          size="thin"
          [focusable]="false"
          overscrollBehavior="contain"
          class="gog-dialog__scroll"
        >
          <ng-container
            *ngComponentOutlet="dialog.config.component; injector: getInjector(dialog)"
          />
        </gog-scroll>
      </div>
    </div>
  </div>
}
