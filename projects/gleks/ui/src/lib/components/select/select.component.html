<!--
  Deliberately not `gog-contained-layout`: `contain: layout` makes this element a stacking
  context, which traps the panel's z-index inside it and lets whatever follows on the page
  paint over the open dropdown.
-->
<div
  class="gog-select"
  [class]="sizeClass()"
  [class.gog-select--disabled]="isDisabled()"
  [class.gog-select--open]="isOpen()"
  [class.gog-select--float-in]="resolvedFloatLabel() === 'in'"
  [class.gog-select--float-on]="resolvedFloatLabel() === 'on'"
  [class.gog-select--float-over]="resolvedFloatLabel() === 'over'"
  [class.gog-select--floated]="isFloatLabelFloated()"
>
  <!--
    Associated with aria-labelledby rather than `for`: the trigger is a <button>, which is
    not a labelable element, so `for` pointing at it is silently ignored by browsers and
    assistive tech alike.
  -->
  @if (label() && resolvedFloatLabel() === 'none') {
    <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -- associated via aria-labelledby above instead, see comment -->
    <label class="gog-select__label" [id]="labelId()">{{ label() }}</label>
  }

  <div class="gog-select__field">
    @if (label() && isFloatLabelActive()) {
      <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -- associated via aria-labelledby above instead, see comment -->
      <label class="gog-select__label gog-select__label--float" [id]="labelId()">{{
        label()
      }}</label>
    }
    <button
      type="button"
      class="gog-select__control"
      [id]="triggerId()"
      [disabled]="isDisabled()"
      [attr.aria-labelledby]="label() ? labelId() : null"
      [attr.aria-label]="label() ? null : ariaLabel() || placeholder() || 'Select'"
      [attr.aria-controls]="listboxId()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-invalid]="hasError()"
      [attr.aria-describedby]="errorId()"
      (click)="toggle()"
      (focus)="onFocusIn()"
      (blur)="onFocusOut()"
      (keydown.enter)="toggle(); $event.preventDefault()"
      (keydown.space)="toggle(); $event.preventDefault()"
      (keydown.escape)="close()"
      (keydown.arrowdown)="onTriggerArrowKeydown($event)"
      (keydown.arrowup)="onTriggerArrowKeydown($event)"
    >
      <span class="gog-select__value" [class.gog-select__value--placeholder]="!selectedOption()">
        {{ selectedLabel() || effectivePlaceholder() }}
      </span>

      <span class="gog-select__chevron" aria-hidden="true">
        <gog-icon
          [template]="chevronSlot()?.templateRef ?? chevronTemplate()"
          name="chevron-down"
        />
      </span>
    </button>

    @if (isOpen() && !resolvedAppendToBody()) {
      <ng-container [ngTemplateOutlet]="panelTpl" />
    }
  </div>

  @if (hasError()) {
    <span class="gog-select__error" [attr.id]="errorId()" role="alert">
      {{ visibleError() }}
    </span>
  }
</div>

<!--
  One template for both render modes. When `appendToBody` is set it is stamped into
  <body> by the overlay, which is why the portal-only modifier and the resolved
  coordinates are applied conditionally: outside the component's subtree the panel can
  no longer inherit the size tokens from the `.gog-select--sm/--lg` wrapper.
-->
<ng-template #panelTpl>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- (click) below is housekeeping stopPropagation, not an interactive handler; the focusable/keyboard-operable elements are the options inside -->
  <div
    [id]="listboxId()"
    class="gog-select__dropdown"
    [class.gog-select__dropdown--up]="!resolvedAppendToBody() && dropdownDirectionState() === 'up'"
    [class.gog-select__dropdown--portal]="resolvedAppendToBody()"
    [class]="panelSizeClass()"
    [style.top.px]="resolvedAppendToBody() ? panelPlacement()?.top : null"
    [style.left.px]="resolvedAppendToBody() ? panelPlacement()?.left : null"
    [style.width]="resolvedAppendToBody() ? resolvedPanelWidth() : null"
    [style.max-height]="resolvedAppendToBody() ? resolvedPanelMaxHeight() : null"
    [style.z-index]="dropdownZIndex() ?? panelZIndex()"
    role="listbox"
    [attr.aria-labelledby]="label() ? labelId() : null"
    (click)="$event.stopPropagation()"
  >
    <!--
      Not a tab stop of its own: the listbox pattern's only stop is the trigger, with
      focus moved between options via the arrow keys (roving-focus.ts), which already
      scrolls the focused option into view natively — no separate keyboard-scroll target
      needed here.
    -->
    <gog-scroll
      size="thin"
      [focusable]="false"
      overscrollBehavior="contain"
      class="gog-select__scroll"
    >
      @for (option of options(); track valueOf(option)) {
        <!--
          tabindex="-1" keeps the list to a single tab stop, as the listbox pattern expects:
          focus is moved between options with the arrow keys, not by tabbing through every
          one of them. Programmatic .focus() still works on a negative tabindex.
        -->
        <button
          type="button"
          class="gog-select__option"
          role="option"
          tabindex="-1"
          [attr.aria-selected]="isSelected(option)"
          [attr.aria-disabled]="isOptionDisabled(option)"
          [class.gog-select__option--selected]="isSelected(option)"
          [class.gog-select__option--disabled]="isOptionDisabled(option)"
          (click)="selectOption(option, $event)"
          (keydown)="onOptionKeydown($event)"
        >
          @if (optionSlot(); as slot) {
            <ng-container
              *ngTemplateOutlet="
                slot.templateRef;
                context: optionContext(option, isSelected(option))
              "
            />
          } @else {
            <span class="gog-select__option-mark" aria-hidden="true">
              @if (isSelected(option)) {
                <gog-icon name="check" />
              }
            </span>
            <span class="gog-select__option-label">{{ labelOf(option) }}</span>
          }
        </button>
      }
    </gog-scroll>
  </div>
</ng-template>
