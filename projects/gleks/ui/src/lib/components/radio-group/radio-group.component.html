<div
  class="gog-radio-group gog-contained-layout"
  role="radiogroup"
  [class.gog-radio-group--horizontal]="orientation() === 'horizontal'"
  [class.gog-radio-group--disabled]="isDisabled()"
  [attr.aria-label]="label() ? null : ariaLabel() || null"
  [attr.aria-labelledby]="labelId()"
  [attr.aria-invalid]="hasError()"
  [attr.aria-describedby]="errorId()"
>
  @if (label()) {
    <span class="gog-radio-group__label" [id]="labelId()">{{ label() }}</span>
  }

  <div class="gog-radio-group__options">
    @for (option of options(); track option.id) {
      <label class="gog-radio" [class.gog-radio--disabled]="isOptionDisabled(option)">
        <input
          class="gog-radio__input"
          type="radio"
          [name]="groupName()"
          [value]="option.id"
          [checked]="isSelected(option)"
          [disabled]="isOptionDisabled(option)"
          (change)="onOptionChange($event, option)"
          (blur)="onBlur()"
        />
        <span class="gog-radio__box" [class.gog-radio__box--checked]="isSelected(option)">
          @if (isSelected(option)) {
            <span class="gog-radio__dot"></span>
          }
        </span>
        <span class="gog-radio__label">{{ option.label }}</span>
      </label>
    }
  </div>

  @if (hasError()) {
    <span class="gog-radio-group__error" [id]="errorId()" role="alert">{{ visibleError() }}</span>
  }
</div>
