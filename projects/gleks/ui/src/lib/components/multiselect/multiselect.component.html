<div
  class="gog-ms-wrapper gog-contained-layout"
  [class.gog-ms-wrapper--sm]="size() === 'sm'"
  [class.gog-ms-wrapper--lg]="size() === 'lg'"
>
  @if (label()) {
    <label class="gog-ms__label font-heading">{{ label() }}</label>
  }

  <div
    class="gog-ms"
    role="combobox"
    [attr.tabindex]="isDisabled() ? -1 : 0"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    [attr.aria-controls]="'gog-ms-listbox-' + instanceId"
    [attr.aria-disabled]="isDisabled()"
    [attr.aria-label]="label() ? null : ariaLabel() || placeholder() || 'Select'"
    [class.gog-ms--open]="isOpen()"
    [class.gog-ms--disabled]="isDisabled()"
    [class.gog-ms--error]="hasError()"
    (click)="toggle()"
    (keydown.enter)="toggle(); $event.preventDefault()"
    (keydown.space)="toggle(); $event.preventDefault()"
    (keydown.escape)="close()"
    (keydown.arrowdown)="onTriggerArrowKeydown($event)"
    (keydown.arrowup)="onTriggerArrowKeydown($event)"
  >
    <span class="gog-ms__value font-body" [class.gog-ms__value--placeholder]="!selectedNames()">
      {{ selectedNames() || placeholder() }}
    </span>

    <span class="gog-ms__actions">
      @if (selectedNames()) {
        <button
          type="button"
          class="gog-ms__clear gog-inline-center"
          (click)="clearTrigger($event)"
          aria-label="Clear selection"
        >
        <gog-icon [template]="clearIconTemplate()" name="close" />
        </button>
      }
    <span class="gog-ms__arrow" [class.gog-ms__arrow--up]="isOpen()" aria-hidden="true">
      <gog-icon [template]="chevronTemplate()" [name]="isOpen() ? 'chevron-up' : 'chevron-down'" />
    </span>
    </span>
  </div>

  @if (isOpen()) {
    <div
      [id]="'gog-ms-listbox-' + instanceId"
      class="gog-ms__dropdown"
      [class.gog-ms__dropdown--up]="dropdownDirectionState() === 'up'"
      role="listbox"
      aria-multiselectable="true"
      [style.z-index]="dropdownZIndex() ?? null"
      (click)="$event.stopPropagation()"
    >
      @if (showControls()) {
        <div class="gog-ms__controls">
          <gog-button variant="ghost" size="sm" (click)="selectAll($event)">Select all</gog-button>
          <gog-button variant="ghost" size="sm" (click)="clearAll($event)">Clear</gog-button>
        </div>
      }
      <div class="gog-ms__options">
        @for (option of options(); track option.id) {
          <button
            type="button"
            class="gog-ms__option font-body"
            role="option"
            [attr.aria-selected]="isSelected(option.id)"
            [attr.aria-disabled]="option.disabled ?? false"
            [class.gog-ms__option--selected]="isSelected(option.id)"
            [class.gog-ms__option--disabled]="option.disabled ?? false"
            (click)="toggleOption(option, $event)"
            (keydown)="onOptionKeydown($event)"
          >
            <span class="gog-ms__option-mark" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" focusable="false" aria-hidden="true">
                <rect
                  x="2.5"
                  y="2.5"
                  width="11"
                  height="11"
                  rx="2"
                  [attr.fill]="isSelected(option.id) ? 'currentColor' : 'none'"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                @if (isSelected(option.id)) {
                  <path
                    d="M4 8L6.75 10.75L12 5.5"
                    stroke="var(--gog-ms-checkbox-checked-color)"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                }
              </svg>
            </span>
            {{ option.name }}
          </button>
        }
      </div>
    </div>
  }

  @if (visibleError()) {
    <span class="gog-ms__error font-body" role="alert">{{ visibleError() }}</span>
  }
</div>
