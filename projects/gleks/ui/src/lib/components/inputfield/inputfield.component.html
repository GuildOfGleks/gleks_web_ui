<div
  class="gog-input-wrapper gog-contained-layout"
  [class.gog-input-wrapper--xsm]="size() === 'xsm'"
  [class.gog-input-wrapper--sm]="size() === 'sm'"
  [class.gog-input-wrapper--lg]="size() === 'lg'"
  [class.gog-input-wrapper--slg]="size() === 'slg'"
  [class.gog-input-wrapper--icon-start]="hasIconStart()"
  [class.gog-input-wrapper--icon-end]="hasIconEnd()"
  [class.gog-input-wrapper--float-in]="resolvedFloatLabel() === 'in'"
  [class.gog-input-wrapper--float-on]="resolvedFloatLabel() === 'on'"
  [class.gog-input-wrapper--float-over]="resolvedFloatLabel() === 'over'"
  [class.gog-input-wrapper--floated]="isFloatLabelFloated()"
>
  @if (label() && resolvedFloatLabel() === 'none') {
    <label class="gog-input__label" [attr.for]="inputId() || null">{{ label() }}</label>
  }
  <div class="gog-input__field-container">
    @if (label() && isFloatLabelActive()) {
      <label class="gog-input__label gog-input__label--float" [attr.for]="inputId() || null">{{
        label()
      }}</label>
    }
    @if (hasIconStart()) {
      @if (hasIconStartAction()) {
        <button
          type="button"
          class="gog-input__icon gog-inline-center gog-input__icon--start gog-input__icon--action"
          [attr.aria-label]="iconStartLabel() || null"
          (click)="onIconStartClick()"
        >
          <gog-icon [template]="iconStartTemplate()" [name]="iconStart() || 'check'" />
        </button>
      } @else {
        <span class="gog-input__icon gog-inline-center gog-input__icon--start" aria-hidden="true">
          <gog-icon [template]="iconStartTemplate()" [name]="iconStart() || 'check'" />
        </span>
      }
    }
    <input
      class="gog-input__field"
      [class.gog-input__field--error]="hasError()"
      [attr.id]="inputId() || null"
      [type]="effectiveType()"
      [attr.name]="name() || null"
      [placeholder]="effectivePlaceholder()"
      [value]="value()"
      [disabled]="isDisabled()"
      [autocomplete]="effectiveAutocomplete()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.aria-invalid]="hasError()"
      [attr.aria-describedby]="hasError() && inputId() ? inputId() + '-error' : null"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
    @if (hasIconEnd()) {
      @if (hasIconEndAction()) {
        <button
          type="button"
          class="gog-input__icon gog-inline-center gog-input__icon--end gog-input__icon--action"
          [attr.aria-label]="effectiveIconEndLabel() || null"
          (click)="onIconEndClick()"
        >
          <gog-icon [template]="iconEndTemplate()" [name]="effectiveIconEnd() || 'check'" />
        </button>
      } @else {
        <span class="gog-input__icon gog-inline-center gog-input__icon--end" aria-hidden="true">
          <gog-icon [template]="iconEndTemplate()" [name]="effectiveIconEnd() || 'check'" />
        </span>
      }
    }
  </div>
  @if (visibleError()) {
    <span
      class="gog-input__error"
      [attr.id]="inputId() ? inputId() + '-error' : null"
      role="alert"
      >{{ visibleError() }}</span
    >
  }
</div>
