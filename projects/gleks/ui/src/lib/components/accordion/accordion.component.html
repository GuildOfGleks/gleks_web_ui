<div
  [class.gog-accordion--loading]="loading()"
  class="gog-accordion gog-contained-layout"
  [class]="sizeClass()"
>
  @if (loading()) {
    @for (row of skeletonRows(); track row) {
      <div class="gog-accordion__item gog-accordion__item--skeleton">
        <div class="gog-accordion__header gog-accordion__header--skeleton">
          <gog-skeleton shape="text" [size]="size()" [width]="skeletonWidth(row)" />
          <!--
            The chevron gets a placeholder too, so the row's silhouette is the one that arrives.
            Without it the right-hand side is empty while loading and the chevron appears out of
            nowhere — the shape-matching placeholder failing at the one thing it is for.
          -->
          @if (showChevron()) {
            <span class="gog-accordion__chevron" aria-hidden="true">
              <!--
                `width="100%"` rather than `[size]`: a skeleton's `size` is its *text* line
                height, so a circle given one came out 18px wide and 64px tall and streaked down
                the row. A circle takes its diameter from `width` and keeps itself round, so
                filling the chevron's own box is what matches it.
              -->
              <gog-skeleton shape="circle" width="100%" />
            </span>
          }
        </div>
      </div>
    }
  } @else {
    @for (item of items(); track item.id) {
      <div
        class="gog-accordion__item"
        [class.gog-accordion__item--open]="isOpen(item.id)"
        [class.gog-accordion__item--disabled]="item.disabled"
      >
        <ng-template #headerButton>
          <button
            [id]="uid + '-btn-' + item.id"
            class="gog-accordion__header"
            [class.gog-accordion__header--chevronless]="!showChevron()"
            [class.gog-accordion__header--open]="isOpen(item.id)"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="uid + '-body-' + item.id"
            [attr.aria-disabled]="item.disabled ? 'true' : null"
            [disabled]="item.disabled || null"
            (click)="toggle(item)"
            (keydown)="onHeaderKeydown($event)"
            type="button"
            gogRipple
            [rippleDisabled]="!rippleEnabled()"
          >
            <span class="gog-accordion__header-content">
              @if (headerTpl(); as tpl) {
                <ng-container
                  *ngTemplateOutlet="
                    tpl.templateRef;
                    context: { $implicit: item, open: isOpen(item.id) }
                  "
                />
              } @else {
                <span class="gog-accordion__title">{{ item.title }}</span>
              }
            </span>
            @if (showChevron()) {
              <span
                class="gog-accordion__chevron"
                [class.gog-accordion__chevron--auto-rotate]="!chevronTpl()"
                aria-hidden="true"
              >
                @if (chevronTpl(); as tpl) {
                  <ng-container
                    *ngTemplateOutlet="
                      tpl.templateRef;
                      context: { $implicit: item, open: isOpen(item.id) }
                    "
                  />
                } @else {
                  <gog-icon name="chevron-down" />
                }
              </span>
            }
          </button>
        </ng-template>

        @if (headingLevel(); as level) {
          <div role="heading" [attr.aria-level]="level" class="gog-accordion__heading">
            <ng-container [ngTemplateOutlet]="headerButton" />
          </div>
        } @else {
          <ng-container [ngTemplateOutlet]="headerButton" />
        }

        <div
          [id]="uid + '-body-' + item.id"
          class="gog-accordion__body"
          [class.gog-accordion__body--open]="isOpen(item.id)"
          role="region"
          [attr.aria-labelledby]="uid + '-btn-' + item.id"
          [attr.aria-hidden]="!isOpen(item.id)"
          [attr.inert]="!isOpen(item.id) ? '' : null"
        >
          <div class="gog-accordion__body-inner">
            @if (contentTpl(); as tpl) {
              <ng-container *ngTemplateOutlet="tpl.templateRef; context: { $implicit: item }" />
            }
          </div>
        </div>
      </div>
    }
  }
</div>
