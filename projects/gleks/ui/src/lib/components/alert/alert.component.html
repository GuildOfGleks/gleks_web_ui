@if (hasIcon()) {
  <gog-icon
    class="gog-alert__icon"
    [ariaHidden]="true"
    [name]="resolvedIconName()"
    [template]="iconSlot()?.templateRef ?? null"
  />
}

<div #content class="gog-alert__main">
  @if (heading()) {
    <p class="gog-alert__heading">{{ heading() }}</p>
  }
  <div class="gog-alert__body">
    <ng-content></ng-content>
  </div>
</div>

@if (dismissible()) {
  <gog-button
    class="gog-alert__close"
    variant="ghost"
    size="sm"
    type="button"
    [ariaLabel]="closeLabel()"
    (gogClick)="onDismiss()"
  >
    <gog-icon name="close" />
  </gog-button>
}

<!--
  The announcement, and it is a *copy* rather than the message itself. This region is in the DOM
  from the alert's first render and empty; the text lands one render later, and that mutation is
  what a screen reader announces. Filling it in the same pass as its own creation announces
  nothing — see the class comment and `gog-toast-container`, which mounts its regions permanently
  for the same reason.

  It renders at all only when the alert announces: `live="off"` leaves no region behind.
-->
@if (liveRole()) {
  <div class="gog-visually-hidden" [attr.role]="liveRole()" [attr.aria-live]="resolvedLive()">
    {{ announcement() }}
  </div>
}
