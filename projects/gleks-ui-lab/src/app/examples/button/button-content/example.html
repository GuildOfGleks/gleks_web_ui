<div>
  <span>text</span>
  @for (size of sizes; track size) {
    <gog-button [size]="size">Save</gog-button>
  }
</div>

<!-- An icon beside a label: no margin or &nbsp; of your own. -->
<div>
  <span>icon + text</span>
  @for (size of sizes; track size) {
    <gog-button [size]="size">
      <gog-icon name="check" />
      Save
    </gog-button>
  }
</div>

<!-- No visible label, so ariaLabel names the inner <button>. -->
<div>
  <span>icon only</span>
  @for (size of sizes; track size) {
    <gog-button [size]="size" ariaLabel="Close">
      <gog-icon name="close" />
    </gog-button>
  }
</div>

<div>
  <span>long text</span>
  <gog-button>Export every selected row to a spreadsheet</gog-button>
</div>
