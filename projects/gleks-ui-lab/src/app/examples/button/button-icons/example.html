<!-- No visible label, so ariaLabel names the inner <button>. -->
<gog-button variant="primary" ariaLabel="Confirm">
  <gog-icon name="check" />
</gog-button>
<gog-button variant="outline" ariaLabel="Dismiss">
  <gog-icon name="close" />
</gog-button>
<gog-button variant="ghost" size="sm" ariaLabel="More info">
  <gog-icon name="info" />
</gog-button>

<!-- One height with or without an icon; no margin or &nbsp; beside it. -->
<gog-button variant="outline">
  <gog-icon name="download" />
  Export
</gog-button>
<gog-button variant="outline">Save</gog-button>
