<div>
  <!-- Tab in and out without choosing: errorDisplay="auto" shows the error, a choice clears it. -->
  <gog-radio-group
    label="Plan (required)"
    [options]="plans"
    [formControl]="control"
    errorMessage="Pick a plan"
    errorDisplay="auto"
  />
  <div>
    <gog-button variant="outline" size="sm" (gogClick)="control.markAsTouched()">
      markAsTouched()
    </gog-button>
    <gog-button variant="outline" size="sm" (gogClick)="control.reset()">reset()</gog-button>
    <gog-button variant="outline" size="sm" (gogClick)="toggleDisabled()">
      {{ control.disabled ? 'enable()' : 'disable()' }}
    </gog-button>
  </div>
  <code>
    value: {{ control.value ?? 'null' }} · touched: {{ control.touched }} · disabled:
    {{ control.disabled }}
  </code>
</div>
