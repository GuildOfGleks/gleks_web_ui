<gog-checkbox label="Email me about releases" />

<!-- No visible text: ariaLabel names it — a row-selection checkbox in a table. -->
<gog-checkbox ariaLabel="Select this row" />

<!-- A long label wraps in a narrow column rather than pushing the box out of line. -->
<div style="max-width: 16rem">
  <gog-checkbox
    label="A label long enough to wrap in a narrow column, which it does rather than pushing the box out of line"
  />
</div>
