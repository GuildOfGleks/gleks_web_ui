<!-- fullWidth + labelPosition="start": the label at one edge, the switch at the other. -->
<gog-toggle fullWidth labelPosition="start" label="Email notifications" [(checked)]="email" />
<gog-toggle
  fullWidth
  labelPosition="start"
  label="Share anonymous usage data"
  [(checked)]="telemetry"
/>
<gog-toggle fullWidth labelPosition="start" label="Beta features" disabled />
