<!-- Beside text: decorative, the default. -->
<span><gog-icon name="warning" /> Disk almost full</span>
<!-- Carrying meaning no text repeats: role="img", named by title. -->
<gog-icon name="warning" [ariaHidden]="false" title="Warning" />
<!-- The only content of a button: name the button, not the icon. -->
<gog-button variant="ghost" ariaLabel="Settings"><gog-icon name="settings" /></gog-button>
