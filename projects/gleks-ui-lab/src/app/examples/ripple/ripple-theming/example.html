<!-- Ordinary inherited custom properties: set one on the element, or anything above it. -->
<div
  gogRipple
  style="
    padding: 12px 20px;
    border: 1px solid var(--gog-border-color);
    background: var(--gog-surface-color);
    color: inherit;
    font: inherit;
    border-radius: var(--gog-radius);
    --gog-ripple-color: var(--gog-accent-color);
  "
>
  Accent-coloured wash
</div>
