<gog-button gogBadge="12">gog-button</gog-button>
<button type="button" style="padding: 4px 12px; font: inherit" gogBadge="4">native button</button>
<a gogButton href="#overview" gogBadge="NEW" badgeVariant="success">a[gogButton]</a>
<!-- An inline element made a box, so the badge's corner is its corner. -->
<span style="display: inline-flex; padding: 8px" gogBadge="2">span</span>
<!-- A round gog-avatar anchors the badge on its circle, not in the empty corner of its box. -->
<gog-avatar name="Guild of Gleks" initials="GG" gogBadge badgeDot badgeVariant="success" />
