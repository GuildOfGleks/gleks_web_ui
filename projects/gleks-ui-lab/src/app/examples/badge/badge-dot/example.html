<!-- On the button, not on its icon: a gog-icon is aria-hidden, and so is a badge inside it. -->
<gog-button
  variant="ghost"
  ariaLabel="Notifications"
  gogBadge
  badgeDot
  badgeAriaLabel="Unread updates"
>
  <gog-icon name="info" />
</gog-button>
<gog-button gogBadge badgeDot badgeVariant="success">Synced</gog-button>
