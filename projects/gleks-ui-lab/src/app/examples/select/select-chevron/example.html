<div class="example">
  <gog-select [options]="sortOptions" [(value)]="sortValue">
    <ng-template gogDropdownChevron>
      <gog-icon name="sort" />
    </ng-template>
  </gog-select>

  <gog-select
    ariaLabel="Country (no visible label)"
    placeholder="Pick a country"
    [options]="countries"
    [(value)]="ariaOnlyValue"
  />
</div>
