<div class="example">
  <gog-select
    label="Assignee"
    optionLabel="profile.fullName"
    optionValue="uuid"
    optionDisabled="suspended"
    [options]="users"
    [(value)]="userId"
  />

  <gog-select
    label="Assignee (object)"
    optionLabel="profile.fullName"
    [optionValue]="null"
    [options]="users"
    [(value)]="userObject"
  />
</div>
