<gog-table
  [value]="rows"
  selectionMode="multiple"
  [(selection)]="selection"
  dataKey="component"
  [showSelectionColumn]="false"
  selectOnRowClick
  size="sm"
  (gogRowClick)="lastClick.set($event.row.component)"
>
  <gog-column field="component" header="Component" />
  <gog-column field="owner" header="Owner" />
  <gog-column field="status" header="Action" width="120px">
    <!-- A press on a control in a cell keeps its own meaning: Open does not select. -->
    <ng-template gogColumnBody [gogColumnBodyTypeOf]="rows" let-row>
      <gog-button variant="ghost" size="xsm" (gogClick)="opened.set(row.component)"
        >Open</gog-button
      >
    </ng-template>
  </gog-column>
</gog-table>

<p>selection: {{ names() }} · gogRowClick: {{ lastClick() }} · opened: {{ opened() }}</p>
