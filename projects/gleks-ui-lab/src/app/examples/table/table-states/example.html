<div>
  <gog-toggle label="loading" [(checked)]="loading" />
  <gog-toggle label="empty" [(checked)]="empty" />
</div>
<gog-table [value]="empty() ? [] : rows" [loading]="loading()" size="sm" [pageSize]="3">
  <gog-column field="component" header="Component" sortable />
  <gog-column field="owner" header="Owner" />
</gog-table>
<!-- emptyMessage: what this table's emptiness means, in its own words. -->
<gog-table [value]="[]" size="sm" emptyMessage="No components match these filters">
  <gog-column field="component" header="Component" />
  <gog-column field="owner" header="Owner" />
</gog-table>
