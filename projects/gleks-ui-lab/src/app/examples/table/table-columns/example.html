<p>defaults — row numbers on, "-" for a missing value</p>
<gog-table [value]="rows" size="sm">
  <gog-column field="component" header="Component" />
  <gog-column field="owner" header="Owner" />
</gog-table>

<p>showColumnBorders, emptyPlaceholder="n/a", column widths</p>
<gog-table
  [value]="rows"
  size="sm"
  showColumnBorders
  emptyPlaceholder="n/a"
  [showRowNumbers]="false"
>
  <gog-column field="component" header="Component" width="12rem" />
  <gog-column field="owner" header="Owner" />
  <gog-column field="updated" header="Updated" minWidth="8rem" />
</gog-table>
