<!-- maxHeight gives the table its own scroll viewport; stickyHeader pins the header to it. -->
<gog-table ariaLabel="Components" [value]="rows" maxHeight="200px" stickyHeader>
  <gog-column field="component" header="Component" width="24rem" />
  <gog-column field="status" header="Status" width="20rem" />
  <gog-column field="owner" header="Owner" width="20rem" />
  <gog-column field="updated" header="Updated" width="20rem" />
</gog-table>
