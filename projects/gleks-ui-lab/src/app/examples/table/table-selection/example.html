<div class="example">
  <gog-table [value]="rows" selectionMode="multiple" [(selection)]="selection" dataKey="component">
    <gog-column field="component" header="Component" />
    <gog-column field="status" header="Status" />
    <gog-column field="owner" header="Owner" />
  </gog-table>

  <p class="readout">Selected: {{ selection().length }}</p>
</div>
