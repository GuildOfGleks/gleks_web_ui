<!-- pageSize is a model: the select writes straight back through it. -->
<gog-table
  [value]="rows"
  [(pageSize)]="pageSize"
  showPageSizeSelect
  [pageSizeOptions]="[2, 3, 6]"
  size="sm"
>
  <gog-column field="component" header="Component" />
  <gog-column field="owner" header="Owner" />
</gog-table>

<p>pageSize: {{ pageSize() }}</p>
