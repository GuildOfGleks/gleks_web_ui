<div>
  <gog-button variant="outline" [gogMenuTrigger]="documentMenu">Document actions</gog-button>

  <gog-menu #documentMenu ariaLabel="Document actions" (gogClosed)="closes.update((n) => n + 1)">
    <button gogMenuItem type="button" (click)="run('Rename')">
      <gog-icon name="pencil" />
      Rename
    </button>
    <!-- An item is your own button, so a shortcut hint is just more of its content. -->
    <button gogMenuItem type="button" (click)="run('Duplicate')">
      <gog-icon name="copy" />
      Duplicate
      <kbd style="margin-inline-start: auto; color: var(--gog-muted-text-color)">Ctrl+D</kbd>
    </button>
    <button gogMenuItem type="button" disabled>
      <gog-icon name="lock" />
      Transfer ownership
    </button>
    <button gogMenuItem type="button" (click)="run('Delete')">
      <gog-icon name="trash" />
      Delete
    </button>
  </gog-menu>
</div>

<p>Last action: {{ lastAction() }} · gogClosed: {{ closes() }}</p>
