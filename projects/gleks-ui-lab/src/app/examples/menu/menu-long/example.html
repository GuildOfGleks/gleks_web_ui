<div class="menu-row">
  <gog-button variant="outline" type="button" [gogMenuTrigger]="branchMenu">
    Move to branch…
  </gog-button>
  <gog-menu #branchMenu ariaLabel="Move to branch">
    @for (branch of branches; track branch) {
      <button gogMenuItem type="button" (click)="moved.set(branch)">{{ branch }}</button>
    }
  </gog-menu>
</div>

<p class="menu-status">
  Moved to: <strong>{{ moved() }}</strong>
</p>
