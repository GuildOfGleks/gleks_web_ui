<div>
  <gog-button variant="outline" [gogMenuTrigger]="branchMenu">Move to branch…</gog-button>
  <gog-menu #branchMenu ariaLabel="Move to branch">
    @for (branch of branches; track branch) {
      <button gogMenuItem type="button" (click)="moved.set(branch)">{{ branch }}</button>
    }
  </gog-menu>
</div>

<p>Moved to: {{ moved() }}</p>
