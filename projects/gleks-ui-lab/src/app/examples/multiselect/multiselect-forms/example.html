<div>
  <!-- Validators.required treats the empty array as missing: "at least one". -->
  <gog-multiselect
    label="Frameworks (reactive form)"
    placeholder="Pick frameworks"
    [options]="frameworks"
    [formControl]="control"
    errorMessage="Pick at least one"
    errorDisplay="auto"
  />
  <div>
    <gog-button variant="outline" size="sm" (gogClick)="control.markAsTouched()">
      markAsTouched()
    </gog-button>
    <gog-button variant="outline" size="sm" (gogClick)="toggleDisabled()">
      {{ control.disabled ? 'enable()' : 'disable()' }}
    </gog-button>
  </div>
  <code>
    value: [{{ control.value.join(', ') }}] · touched: {{ control.touched }} · disabled:
    {{ control.disabled }}
  </code>
</div>
