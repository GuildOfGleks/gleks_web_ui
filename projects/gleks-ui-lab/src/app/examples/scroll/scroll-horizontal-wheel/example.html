<!-- The same content on the same axis; only the input differs. Hover each and turn the wheel. -->
<p>off — a vertical wheel scrolls the page (the default)</p>
<gog-scroll axis="horizontal" [autoHide]="false" ariaLabel="Columns, wheel off">
  <div style="display: flex; gap: 8px; padding: 8px">
    @for (item of items; track item) {
      <gog-chip [clickable]="false">{{ item }}</gog-chip>
    }
  </div>
</gog-scroll>

<p>horizontalWheel — the same turn scrolls the row</p>
<gog-scroll axis="horizontal" [autoHide]="false" horizontalWheel ariaLabel="Columns, wheel on">
  <div style="display: flex; gap: 8px; padding: 8px">
    @for (item of items; track item) {
      <gog-chip [clickable]="false">{{ item }}</gog-chip>
    }
  </div>
</gog-scroll>
