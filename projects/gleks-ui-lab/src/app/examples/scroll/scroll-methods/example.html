<div>
  <gog-button size="sm" (gogClick)="scroller()?.scrollToTop()">To top</gog-button>
  <gog-button size="sm" (gogClick)="scroller()?.scrollToBottom()">To bottom</gog-button>
</div>
<!-- #scrollRegion, not #scroller: a template reference would shadow the viewChild signal. -->
<gog-scroll #scrollRegion style="height: 200px" ariaLabel="Example list">
  @for (item of items; track item) {
    <p>{{ item }}</p>
  }
</gog-scroll>
