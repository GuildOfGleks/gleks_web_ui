<div class="example">
  <div class="controls">
    <gog-button size="sm" (gogClick)="scroller().scrollToTop()">To top</gog-button>
    <gog-button size="sm" (gogClick)="scroller().scrollToBottom()">To bottom</gog-button>
  </div>

  <gog-scroll class="box" ariaLabel="Rows">
    @for (row of rows; track row) {
      <p>{{ row }}</p>
    }
  </gog-scroll>
</div>
