<!-- Collapsible throughout: closed and disabled are states of its toggle. -->
@for (state of states; track state.name) {
  @for (variant of variants; track variant) {
    <gog-panel
      [variant]="variant"
      size="md"
      collapsible
      [open]="state.open"
      [disabled]="state.disabled"
      [loading]="state.loading"
    >
      <h4 gogPanelHeader>{{ variant }}, {{ state.name }}</h4>
      <p>Sixteen events since Tuesday.</p>
    </gog-panel>
  }
}
