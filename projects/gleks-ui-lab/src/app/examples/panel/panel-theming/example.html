<!-- Instance tokens, inline: they beat the variant and size classes without a fight. -->
<gog-panel
  size="md"
  style="
    --gog-panel-elevated-bg: color-mix(in srgb, var(--gog-accent-color) 10%, transparent);
    --gog-panel-radius: 14px;
    --gog-panel-heading-color: var(--gog-accent-color);
  "
>
  <h4 gogPanelHeader>Overridden per instance</h4>
  <p>Three instance tokens on the element. No <code>::ng-deep</code>.</p>
</gog-panel>
