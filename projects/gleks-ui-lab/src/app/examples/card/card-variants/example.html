<!-- Every card holds a gogCardLink: disabled is mostly about what happens to that link. -->
@for (variant of variants; track variant) {
  @for (state of states; track state) {
    <gog-card [variant]="variant" [disabled]="state === 'disabled'" [loading]="state === 'loading'">
      <h4 gogCardHeader>
        <a gogCardLink routerLink="/components/card" fragment="examples">{{ variant }}</a>
      </h4>
      <p>{{ state }} — revenue is up 12% on the quarter.</p>
    </gog-card>
  }
}
