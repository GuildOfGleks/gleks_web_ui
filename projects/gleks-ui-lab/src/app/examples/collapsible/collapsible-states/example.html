<!-- gog-collapsible renders no box of its own (display: contents), so each cell is a <div>. -->
<div>
  <span>&lt;button&gt;</span>
  @for (state of states; track state.name) {
    <div>
      <gog-collapsible [open]="state.open" [disabled]="state.disabled">
        <button type="button" gogButton variant="outline" gogCollapsibleTrigger>
          {{ state.name }}
        </button>
        <p gogCollapsibleContent>Ships within 2 business days.</p>
      </gog-collapsible>
    </div>
  }
</div>
<div>
  <!-- The directive makes a <div> a control: role="button", tabindex="0", Enter and Space. -->
  <span>&lt;div&gt;</span>
  @for (state of states; track state.name) {
    <div>
      <gog-collapsible [open]="state.open" [disabled]="state.disabled">
        <div gogCollapsibleTrigger>{{ state.name }}</div>
        <p gogCollapsibleContent>Ships within 2 business days.</p>
      </gog-collapsible>
    </div>
  }
</div>
