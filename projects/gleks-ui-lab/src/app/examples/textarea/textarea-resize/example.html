<!-- The grip is the library's own; the drag underneath it is the browser's. -->
<gog-textarea label="resize unset (vertical)" value="Ship on Friday." [rows]="2" />
<gog-textarea label='resize="horizontal"' value="Ship on Friday." [rows]="2" resize="horizontal" />
<gog-textarea label='resize="both"' value="Ship on Friday." [rows]="2" resize="both" />
<gog-textarea label='resize="none"' value="Ship on Friday." [rows]="2" resize="none" />
<gog-textarea label="Disabled: no grip" value="Ship on Friday." [rows]="2" disabled />
