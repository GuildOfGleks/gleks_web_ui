<div class="example">
  <div class="chat-thread">
    @for (message of messages; track $index) {
      <div class="chat-row" [class.chat-row--mine]="message.fromMe">
        @if (!message.fromMe) {
          <gog-skeleton shape="circle" size="xsm" />
        }
        <gog-skeleton shape="rect" size="sm" [width]="message.width" />
      </div>
    }
  </div>
</div>
