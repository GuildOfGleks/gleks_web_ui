<div class="lab-layout">
  <!-- 1. ХЕДЕР (Шапка сайта) -->
  <header class="lab-header">
    <div class="header-left">
      <!-- Only below the tablet breakpoint, where the sidebar becomes a drawer (app.scss). -->
      <button
        type="button"
        class="nav-toggle"
        [attr.aria-expanded]="isNavOpen()"
        aria-controls="lab-nav"
        aria-label="Navigation"
        (click)="toggleNav()"
      >
        <fa-icon [icon]="faBars" />
      </button>
      <img src="/gleks_ui_logo.svg" alt="" class="logo-icon" width="28" height="32" />
      <span class="logo-title font-heading">GUILD OF GLEKS UI</span>
      <a
        class="version-tag"
        [href]="libraryNpmUrl"
        target="_blank"
        rel="noopener"
        [title]="'This site documents @guildofgleks/ui ' + libraryVersion"
        >v{{ libraryVersion }}</a
      >
    </div>

    <div class="header-controls">
      <div class="theme-switcher">
        <gog-button
          variant="ghost"
          size="sm"
          ariaLabel="Change theme"
          (gogClick)="toggleThemeMenu()"
        >
          <fa-icon [icon]="faPalette"></fa-icon>
        </gog-button>

        @if (isThemeMenuOpen()) {
          <div class="theme-switcher__menu" role="menu" aria-label="Theme">
            @for (option of themeOptions; track option.value) {
              <button
                type="button"
                role="menuitemradio"
                class="theme-switcher__item"
                [class.theme-switcher__item--active]="option.value === activeTheme()"
                [attr.aria-checked]="option.value === activeTheme()"
                (click)="selectTheme(option.value)"
              >
                {{ option.label }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </header>

  <!-- Closes the drawer on a tap outside it. Rendered only while open, and only visible below the
       breakpoint, so it can never sit over the desktop layout. -->
  @if (isNavOpen()) {
    <button
      type="button"
      class="lab-nav-backdrop"
      aria-label="Close navigation"
      (click)="closeNav()"
    ></button>
  }

  <aside id="lab-nav" class="lab-sidebar-left" [class.lab-sidebar-left--open]="isNavOpen()">
    <app-sidebar-left class="lab-sidebar-left__inner" />
  </aside>

  <main class="lab-main-content">
    <gog-scroll #mainScroll class="lab-main-scroll" ariaLabel="Page content">
      <div class="content-container">
        <router-outlet />
      </div>
    </gog-scroll>

    <footer class="lab-footer">
      <div class="footer-copy">© 2026 Guild of Gleks UI. Apache License 2.0.</div>
      <div class="footer-links">
        @for (link of footerLinks; track link.href) {
          <a [href]="link.href" target="_blank" rel="noopener">{{ link.label }}</a>
        }
      </div>
    </footer>
  </main>

  <aside class="lab-sidebar-right">
    <gog-scroll class="lab-sidebar-right__scroll" size="thin" ariaLabel="On this page">
      <app-toc />
    </gog-scroll>
  </aside>
</div>

<!-- Mounted at the app root, outside `.lab-layout`, and deliberately not inside a page.
     `gog-scroll` sets `contain: layout style`, which makes it the containing block for any
     `position: fixed` descendant — a dialog opened from a page mounted inside the content
     scroller therefore covered the article instead of the window. Both outlets are
     "mount once per app" pieces anyway, which is exactly what the library's own docs say. -->
<gog-dialog />
<gog-toast-container [maxVisiblePerPosition]="5" />
