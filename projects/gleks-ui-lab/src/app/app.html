<div class="lab-layout">
  <!-- 1. ХЕДЕР (Шапка сайта) -->
  <header class="lab-header">
    <div class="header-left">
      <img src="/gleks_ui_logo.svg" alt="" class="logo-icon" width="28" height="32" />
      <span class="logo-title font-heading">GUILD OF GLEKS UI</span>
      <a
        class="version-tag"
        [href]="libraryNpmUrl"
        target="_blank"
        rel="noopener"
        [title]="'This site documents @guildofgleks/ui ' + libraryVersion"
        >v{{ libraryVersion }}</a
      >
    </div>

    <div class="header-controls">
      <div class="theme-switcher">
        <gog-button
          variant="ghost"
          size="sm"
          ariaLabel="Change theme"
          (gogClick)="toggleThemeMenu()"
        >
          <fa-icon [icon]="faPalette"></fa-icon>
        </gog-button>

        @if (isThemeMenuOpen()) {
          <div class="theme-switcher__menu" role="menu" aria-label="Theme">
            @for (option of themeOptions; track option.value) {
              <button
                type="button"
                role="menuitemradio"
                class="theme-switcher__item"
                [class.theme-switcher__item--active]="option.value === activeTheme()"
                [attr.aria-checked]="option.value === activeTheme()"
                (click)="selectTheme(option.value)"
              >
                {{ option.label }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </header>

  <aside class="lab-sidebar-left">
    <app-sidebar-left class="lab-sidebar-left__inner" />
  </aside>

  <main class="lab-main-content">
    <gog-scroll class="lab-main-scroll" ariaLabel="Page content">
      <div class="content-container">
        <router-outlet />
      </div>
    </gog-scroll>

    <footer class="lab-footer">
      <div class="footer-copy">© 2026 Guild of Gleks UI. Apache License 2.0.</div>
      <div class="footer-links">
        @for (link of footerLinks; track link.href) {
          <a [href]="link.href" target="_blank" rel="noopener">{{ link.label }}</a>
        }
      </div>
    </footer>
  </main>

  <aside class="lab-sidebar-right">
    <gog-scroll class="lab-sidebar-right__scroll" size="thin" ariaLabel="On this page">
      <app-toc />
    </gog-scroll>
  </aside>
</div>
