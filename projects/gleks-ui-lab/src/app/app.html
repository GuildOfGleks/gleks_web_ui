<div class="lab-layout">
  <app-header [navOpen]="isNavOpen()" (navToggle)="toggleNav()" />

  <!-- Closes the drawer on a tap outside it. Rendered only while open, and only visible below the
       breakpoint, so it can never sit over the desktop layout. -->
  @if (isNavOpen()) {
    <button
      type="button"
      class="lab-nav-backdrop"
      aria-label="Close navigation"
      (click)="closeNav()"
    ></button>
  }

  <aside id="lab-nav" class="lab-sidebar-left" [class.lab-sidebar-left--open]="isNavOpen()">
    <app-sidebar-left class="lab-sidebar-left__inner" />
  </aside>

  <main class="lab-main-content">
    <gog-scroll #mainScroll class="lab-main-scroll" ariaLabel="Page content">
      <div class="content-container" [attr.dir]="isRtl() ? 'rtl' : null">
        <router-outlet />
      </div>
    </gog-scroll>

    <footer class="lab-footer">
      <div class="footer-copy">© 2026 Guild of Gleks UI. Apache License 2.0.</div>
      <div class="footer-links">
        @for (link of footerLinks; track link.href) {
          <a [href]="link.href" target="_blank" rel="noopener">{{ link.label }}</a>
        }
      </div>
    </footer>
  </main>

  <aside class="lab-sidebar-right">
    <gog-scroll class="lab-sidebar-right__scroll" size="thin" ariaLabel="On this page">
      <app-toc />
    </gog-scroll>
  </aside>
</div>

<!-- Mounted at the app root, outside `.lab-layout`, and deliberately not inside a page.
     `gog-scroll` sets `contain: layout style`, which makes it the containing block for any
     `position: fixed` descendant — a dialog opened from a page mounted inside the content
     scroller therefore covered the article instead of the window. Both outlets are
     "mount once per app" pieces anyway, which is exactly what the library's own docs say. -->
<gog-dialog />
<gog-toast-container [maxVisiblePerPosition]="5" />
