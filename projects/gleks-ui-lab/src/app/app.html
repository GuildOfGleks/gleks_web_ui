<div class="lab-layout">

  <!-- 1. ХЕДЕР (Шапка сайта) -->
  <header class="lab-header">
    <div class="header-left">
      <span class="logo-title font-heading">GUILD OF GLEKS UI</span>
      <span class="version-tag">v21.2.2</span>
    </div>

    <div class="header-controls">
      <div class="theme-switcher">
        <gog-button
          variant="ghost"
          size="sm"
          ariaLabel="Change theme"
          (gogClick)="toggleThemeMenu()"
        >
          <fa-icon [icon]="faPalette"></fa-icon>
        </gog-button>

        @if (isThemeMenuOpen()) {
          <div class="theme-switcher__menu" role="menu" aria-label="Theme">
            @for (option of themeOptions; track option.value) {
              <button
                type="button"
                role="menuitemradio"
                class="theme-switcher__item"
                [class.theme-switcher__item--active]="option.value === activeTheme()"
                [attr.aria-checked]="option.value === activeTheme()"
                (click)="selectTheme(option.value)"
              >
                {{ option.label }}
              </button>
            }
          </div>
        }
      </div>
      <a href="https://www.npmjs.com/package/@guildofgleks/ui" target="_blank" class="nav-link">NPM</a>
    </div>
  </header>

  <aside class="lab-sidebar-left">
    <app-sidebar-left />
  </aside>

  <main class="lab-main-content">
    <div class="content-container">
      <router-outlet />
    </div>

    <footer class="lab-footer">
      <div class="footer-copy">© 2026 Guild of Gleks UI. MIT License.</div>
      <div class="footer-links">
        <a href="https://your-domain.com">Documentation</a>
        <a href="https://www.npmjs.com/package/@guildofgleks/ui">NPM Package</a>
      </div>
    </footer>
  </main>

  <aside class="lab-sidebar-right">
    <app-toc />
  </aside>

</div>
