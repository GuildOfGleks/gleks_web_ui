<article class="demo-card">
  @if (title()) {
    <h3 class="demo-card__title">{{ title() }}</h3>
  }

  <div class="demo-card__meta">
    <ng-content />
  </div>

  <div class="demo-card__preview">
    <ng-container *ngComponentOutlet="component()" />
  </div>

  <app-code-tabs [source]="source()" [title]="title()" />
</article>
