# =============================================================================
# CD Pipeline — gleks-ui-lab
# Trigger: manual only (workflow_dispatch). Never runs on push.
# Invoke locally with: scripts/deploy-lab.sh [--target test|prod]
#
# Flow:
#   target=test -> lint + build image :<sha> -> deploy to glx-01 (ui.chebureck.org)
#   target=prod -> NO rebuild: the gate checks that this commit's deploy to test succeeded, then the
#                  same image :<sha> goes to glx-02 (ui.guildofgleks.com)
#
# The gate reads GitHub's own deployment records: the deploy job runs in the `test` environment, so
# every test run leaves a deployment for its commit whose last status is success or failure. The
# image existing is not enough -- `build` pushes :<sha> before the test deploy runs, so a commit
# whose test smoke test failed still has an image in GHCR.
#
# The servers sit behind a Cloudflare Tunnel, so self-hosted runners on the servers themselves do
# the deploy. Per-server settings live in the GitHub environments "test" and "production"
# (vars.LAB_DOMAIN, vars.HOST_PORT). LAB_DOMAIN must be listed in ALLOWED_HOSTS in
# projects/gleks-ui-lab/src/server.ts, or the smoke test gets a 400 and the deploy stops.
# =============================================================================

name: Deploy gleks-ui-lab
run-name: Deploy gleks-ui-lab to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [test, prod]
        default: test
      image_tag:
        description: 'Extra image tag (applied only when building, i.e. on test)'
        required: false
        default: 'latest'

concurrency:
  group: deploy-lab-${{ inputs.target }}
  cancel-in-progress: false

env:
  CONTAINER_NAME: gleks-ui-lab
  # Must match PORT in projects/gleks-ui-lab/Dockerfile. It is also passed to every `docker run` as
  # PORT, so a rollback to an image built before the port moved (which listened on 80) comes up
  # on this port too.
  CONTAINER_PORT: 8080

jobs:
  build:
    if: inputs.target == 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # See ci.yml: the npm bundled with Node can disagree with the
      # lock file's optional peer deps, so pin the npm version explicitly.
      - name: Use pinned npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compute image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gleks-ui-lab" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/gleks-ui-lab/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.image }}:${{ inputs.image_tag }}
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Production only: refuse a commit that has not been deployed to test successfully.
  gate:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - name: Require a successful test deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=test&sha=$GITHUB_SHA&per_page=100" --jq '.[].id')"
          for id in $ids; do
            # Statuses are listed newest first; the first one is where that deployment ended.
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')"
            if [ "$state" = "success" ]; then
              echo "Commit $GITHUB_SHA was deployed to test successfully (deployment $id)."
              exit 0
            fi
          done
          echo "!!! Commit $GITHUB_SHA has no successful deploy to test. Deploy it to test first:" >&2
          echo "    scripts/deploy-lab.sh --target test --ref <this ref>" >&2
          exit 1

  deploy:
    needs: [build, gate]
    # One of the two is skipped on purpose: `build` on prod, `gate` on test.
    if: ${{ !cancelled() && ((inputs.target == 'test' && needs.build.result == 'success') || (inputs.target == 'prod' && needs.gate.result == 'success')) }}
    runs-on: [self-hosted, "${{ inputs.target == 'prod' && 'glx-02' || 'glx-01' }}"]
    environment: ${{ inputs.target == 'prod' && 'production' || 'test' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          DOMAIN: ${{ vars.LAB_DOMAIN }}
          # The port the tunnel points at (http://localhost:9001).
          HOST_PORT: ${{ vars.HOST_PORT || '9001' }}
          # Optional file of app environment variables on the server itself. If it sets
          # NG_ALLOWED_HOSTS, that replaces server.ts's list and must include localhost,127.0.0.1.
          ENV_FILE: /opt/gleks-ui-lab/.env
        run: |
          set -e

          if [ -z "$DOMAIN" ]; then
            echo "!!! vars.LAB_DOMAIN is not set in environment '$TARGET'. Set it: gh variable set LAB_DOMAIN --env ..." >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gleks-ui-lab:${GITHUB_SHA}"
          NAME="$CONTAINER_NAME"
          PORT="$HOST_PORT"
          CPORT="$CONTAINER_PORT"
          SMOKE_NAME="$NAME-smoke"
          SMOKE_PORT=9099

          ENV_ARGS=()
          if [ -f "$ENV_FILE" ]; then
            ENV_ARGS=(--env-file "$ENV_FILE")
            echo "Using env file $ENV_FILE"
          fi

          # A page whose server-rendered title differs from the one in index.html. The request carries
          # the real public Host header, exactly as cloudflared will send it, so a domain missing from
          # server.ts's ALLOWED_HOSTS fails here (with a 400) instead of on the live site.
          # See docs/lab-seo.md.
          PROBE_PATH="/components/table"
          PROBE_TITLE="Angular Table Component"

          # `grep -F … >/dev/null`, never `grep -q`: this step runs under `bash -e -o pipefail`, and
          # `grep -q` exits at the first match -- the title is ~500 bytes into a multi-megabyte page --
          # so curl dies writing the rest (exit 23) and pipefail fails a probe that found the title.
          # Every deploy's smoke test failed that way on 2026-09-30. Reading the whole stream avoids it.
          probe() {
            curl -sf --max-time 10 -H "Host: $DOMAIN" "http://127.0.0.1:$1$PROBE_PATH" 2>/dev/null | grep -F "$PROBE_TITLE" >/dev/null
          }

          wait_healthy() {
            i=0
            while [ "$i" -lt 45 ]; do
              if probe "$1"; then
                echo "  $2 healthy after ${i}s"
                return 0
              fi
              i=$((i + 1))
              sleep 1
            done
            return 1
          }

          # Published on loopback only: the site is reachable from outside solely through the tunnel.
          run_live() {
            docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              "${ENV_ARGS[@]}" \
              -e PORT="$CPORT" \
              -p "127.0.0.1:$PORT:$CPORT" \
              "$1"
          }

          echo "=== [$TARGET @ $HOSTNAME] Pulling $IMAGE ==="
          if ! docker pull "$IMAGE"; then
            if [ "$TARGET" = "prod" ]; then
              echo "!!! No image for commit $GITHUB_SHA. Deploy this commit to test first." >&2
            fi
            exit 1
          fi

          PREVIOUS_IMAGE="$(docker inspect --format '{{.Image}}' "$NAME" 2>/dev/null || true)"

          # --- 1. Prove the new image works BEFORE the live container is touched -------------
          echo "=== Smoke-testing the new image on :$SMOKE_PORT ==="
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true
          docker run -d --name "$SMOKE_NAME" "${ENV_ARGS[@]}" -e PORT="$CPORT" -p "127.0.0.1:$SMOKE_PORT:$CPORT" "$IMAGE" >/dev/null

          if ! wait_healthy "$SMOKE_PORT" "candidate"; then
            echo "!!! New image failed its smoke test. The live site was NOT touched."
            docker logs --tail 60 "$SMOKE_NAME" || true
            docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

          # --- 2. Swap ----------------------------------------------------------------------
          # `-t 20` is an upper bound: server.ts closes on SIGTERM, so this returns quickly.
          echo "=== Swapping in the new container ==="
          docker stop -t 20 "$NAME" 2>/dev/null || true
          docker rm "$NAME" 2>/dev/null || true
          run_live "$IMAGE"

          # --- 3. Verify live, and roll back if it never comes up ---------------------------
          if wait_healthy "$PORT" "live"; then
            echo "=== Deploy OK: https://$DOMAIN ==="
          else
            echo "!!! New container did not become healthy on :$PORT."
            docker logs --tail 60 "$NAME" || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo "=== Rolling back to the previous image ==="
              docker rm -f "$NAME" >/dev/null 2>&1 || true
              run_live "$PREVIOUS_IMAGE"
              wait_healthy "$PORT" "rolled-back" || echo "!!! Rollback also unhealthy -- the site is DOWN."
            else
              echo "!!! No previous image recorded (first deploy?) -- nothing to roll back to."
            fi
            exit 1
          fi

          # Dangling layers only: the previous release must survive for rollbacks.
          docker image prune -f

      # On a self-hosted runner the login persists in ~/.docker/config.json — don't leave it there.
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io

  # Only after a healthy PROD deploy, and only once you switch it on:
  #   gh variable set INDEXNOW_ENABLED --env production --body true
  # Runs on a GitHub-hosted runner so the servers don't need Node installed.
  # See scripts/ping-indexnow.mjs.
  announce:
    needs: deploy
    if: inputs.target == 'prod' && vars.INDEXNOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # Regenerated rather than read from the checkout so the announced list matches the image.
      - name: Announce URLs to IndexNow (Bing)
        run: |
          npm run generate:sitemap
          node scripts/ping-indexnow.mjs
