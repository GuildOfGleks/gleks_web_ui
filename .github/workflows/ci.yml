name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # package-lock.json is generated by the npm version pinned in package.json's
      # "packageManager" field. Node 22.x bundles an older npm whose dependency
      # resolution disagrees on optional peer deps (e.g. @napi-rs/wasm-runtime's
      # @emnapi/* peers), which makes `npm ci` reject an otherwise-valid lock file.
      - name: Use pinned npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Enforces the four-rule design-token contract (see the header of
      # scripts/check-tokens.mjs and "Theming via CSS custom properties" in
      # styling.instructions.md): no real default hidden in a var() fallback, every token
      # read resolves, theme.css's `:root` block stays literals-only, and the
      # instance-layer allowlist matches the stylesheets.
      - name: Design-token contract check
        run: npm run check:tokens

      # Enforces the deprecation lifecycle from api-design.instructions.md: every
      # `@deprecated` tag carries all four parts, and none names a removal version the
      # library has already reached. `GogSelectOption`/`GogMultiselectOption` overran
      # their announced 21.4.0 removal by a whole minor before this step existed.
      - name: Deprecation ratchet check
        run: npm run check:deprecations

      # The geometry laws from styling.instructions.md — the 4px grid, horizontal padding at
      # exactly twice vertical on every control, and 24x24 CSS px of pointer target. Wired in the
      # moment it reached zero and not before (docs/component-geometry.md): the sweep that made it
      # green was 25 commits long, and a permanently red step over a tracked condition teaches
      # everyone to ignore CI. Laws 2 and 4 are not in it yet and the script's header says why.
      # Three scripts. The second reads the icon registry's path data rather than theme.css, for
      # L7 (a glyph centres its ink in its own viewBox). The third is law 2, concentric radii,
      # which joined once its six findings were fixed -- it needed a declared parent per nested
      # radius, since a name is not a parent. The fourth is law 4 and D8, which joined last and
      # reads the component stylesheets as well as theme.css -- eight literal line-heights lived
      # there, invisible to a token-level sweep. All five laws are gated.
      - name: Geometry check
        run: npm run check:geometry

      # Every class a library template applies to its own markup reads `gog-`, or is a named
      # exception. `docs/backlog.md`'s confirmation-dialog defect -- two utility classes with no
      # CSS rule anywhere in the library -- is why this exists: the prefix would have flagged both
      # on day one. Deliberately not "every class has a rule" -- ~50 of the library's own state and
      # behaviour hooks (`gog-scroll--dragging`, `gog-select--floated`, …) have none by design, and
      # a fifty-entry exception list would be a threshold, not documentation.
      - name: Class-name check
        run: npm run check:class-names

      # The elevation ladder (21.12.0, docs/component-geometry.md D5). Three rules, and the
      # ladder's own arithmetic is deliberately not one of them -- every step is the same two
      # layers with one number changed, so it is asserted by construction. What is checked is
      # what drifted before the family existed: a theme must declare all ten knobs (a custom
      # property inherits, so a partial set silently borrows the enclosing theme's weight -- that
      # one was caught in a browser, not by a check), no shadow token may be hand-written unless
      # it is a named non-height (an inset ring, an accent glow), and no preset may write a
      # shadow at all. Before it: 22 hand-authored values across 11 themes, a dropdown menu
      # carrying a modal's shadow, and two presets whose dialog had the elevation of a card.
      - name: Elevation check
        run: npm run check:elevation

      # The perceptual half of the palette gate (21.12.0), the companion to `check:contrast`.
      # WCAG's ratio is a luminance formula: it cannot say whether a state step is visible, whether
      # a status colour has stopped being a colour, or whether two statuses are the same hue. Three
      # rules, every threshold set after measuring all eleven palettes rather than before. It found
      # two on its first run, neither of which any ratio would have caught: `one-light`'s pressed
      # state sat 0.023 of lightness from its rest state (both passing AA comfortably, and the same
      # colour), and `terminal`'s success and info were 4.6 degrees of hue apart. The rule
      # docs/backlog.md proposed -- "ramps must be monotonic in L" -- is deliberately NOT here; the
      # measurement disproved it, and the script's header says why.
      - name: OKLCH palette check
        run: npm run check:oklch

      # RTL guard. A `padding`/`margin` shorthand that sets the two horizontal sides
      # differently is physical, so it does not mirror under `dir="rtl"` — and because the
      # sidedness lives in a value's *position* rather than in a `left`/`right` keyword, no
      # grep and no style-less unit test can see it. Four components shipped 21.5.0 with the
      # gutter for their trailing chrome on the opposite side from the chrome itself.
      - name: Logical-property check
        run: npm run check:logical-properties

      # The three global stylesheets land on elements the *consumer* owns, and Angular stamps
      # `[_ngcontent-…]` onto every rule in a component stylesheet — so an app's plainest
      # one-class rule ties `.gog-btn:disabled` and wins on source order. Five state rules
      # shipped that way; a disabled button rendered `cursor: pointer` at full opacity.
      - name: State-specificity check
        run: npm run check:state-specificity

      # A loading component hides its content behind `aria-hidden` placeholders, so without
      # `aria-busy` it reads as empty rather than busy. Three of the five components with a
      # `loading` input shipped without it; this was added the moment the last was fixed, so
      # there is nothing to allowlist and an exception would only mean a regression.
      - name: Loading-state aria check
        run: npm run check:loading-aria

      # Every shipped palette against WCAG AA, on the pairs a user actually reads: body and muted
      # text on both surfaces, a filled button's label at rest *and* on hover, and the 3:1
      # non-text pairs for field borders and the focus ring. Wired in once the last finding was
      # fixed (21.7.0) — deliberately not before, because a permanently red step over a known,
      # tracked condition teaches everyone to ignore CI. All 11 themes pass; a new preset that
      # does not is what this is here to stop.
      - name: Theme contrast check
        run: npm run check:contrast

      # The same bar for the two apps' *own* chrome — the lab's header, sidebars, search panel,
      # theme menu and code blocks, the showcase's page furniture and demo cards, all hand-written
      # CSS reading `--gog-*` tokens that the step above has never looked at. Eleven palettes a
      # reader can switch between, and until 2026-09-03 not one pair of it had been measured.
      #
      # The two resolve their palettes from different places, on purpose: the lab from
      # node_modules, because it renders with the *published* package, and the showcase from the
      # workspace, because it builds the library from source. So a release that changes a palette
      # can turn the lab half red without the lab changing a line — that is the point — while the
      # showcase half catches the same class of thing one release earlier. It already has: the
      # showcase is where error text turned out to be below AA in four themes.
      - name: App contrast check
        run: npm run check:app-contrast

      # The docs site serves `theme-starter.css` as the file a consumer copies wholesale, and it
      # opens by calling itself "every token the library paints with". Nothing enforced that, so
      # it had drifted to 714 of 1312 tokens with fifteen components missing entirely. The
      # component block is generated from the installed package now; this fails if it is stale or
      # if any token is unaccounted for. Note it reads node_modules, so it checks the *published*
      # package — which is the version the lab documents.
      - name: Theme starter completeness
        run: npm run check:theme-starter

      # The library must build standalone, before anything that consumes it.
      - name: Build @gleks/ui
        run: npm run build:lib

      - name: Test @gleks/ui
        run: npm run test:lib

      # Runs the same suite again with v8 coverage and the thresholds in angular.json's
      # `coverage` configuration. Kept separate from the step above so a failure here reads
      # as "coverage dropped", not "tests broke". Baseline and the reason the floor sits
      # where it does: docs/hardening-21.5.0.md, iteration 1.
      - name: Coverage @gleks/ui
        run: npm run test:lib:coverage

      # Catches breaking changes to the library's public API: the showcase is the
      # only real consumer, so a compile error here means a consumer-facing break.
      - name: Build ui-showcase
        run: npm run build:showcase
