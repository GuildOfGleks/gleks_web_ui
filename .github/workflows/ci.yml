name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # package-lock.json is generated by the npm version pinned in package.json's
      # "packageManager" field. Node 22.x bundles an older npm whose dependency
      # resolution disagrees on optional peer deps (e.g. @napi-rs/wasm-runtime's
      # @emnapi/* peers), which makes `npm ci` reject an otherwise-valid lock file.
      - name: Use pinned npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Enforces the four-rule design-token contract (see the header of
      # scripts/check-tokens.mjs and "Theming via CSS custom properties" in
      # styling.instructions.md): no real default hidden in a var() fallback, every token
      # read resolves, theme.css's `:root` block stays literals-only, and the
      # instance-layer allowlist matches the stylesheets.
      - name: Design-token contract check
        run: npm run check:tokens

      # Enforces the deprecation lifecycle from api-design.instructions.md: every
      # `@deprecated` tag carries all four parts, and none names a removal version the
      # library has already reached. `GogSelectOption`/`GogMultiselectOption` overran
      # their announced 21.4.0 removal by a whole minor before this step existed.
      - name: Deprecation ratchet check
        run: npm run check:deprecations

      # RTL guard. A `padding`/`margin` shorthand that sets the two horizontal sides
      # differently is physical, so it does not mirror under `dir="rtl"` — and because the
      # sidedness lives in a value's *position* rather than in a `left`/`right` keyword, no
      # grep and no style-less unit test can see it. Four components shipped 21.5.0 with the
      # gutter for their trailing chrome on the opposite side from the chrome itself.
      - name: Logical-property check
        run: npm run check:logical-properties

      # The three global stylesheets land on elements the *consumer* owns, and Angular stamps
      # `[_ngcontent-…]` onto every rule in a component stylesheet — so an app's plainest
      # one-class rule ties `.gog-btn:disabled` and wins on source order. Five state rules
      # shipped that way; a disabled button rendered `cursor: pointer` at full opacity.
      - name: State-specificity check
        run: npm run check:state-specificity

      # A loading component hides its content behind `aria-hidden` placeholders, so without
      # `aria-busy` it reads as empty rather than busy. Three of the five components with a
      # `loading` input shipped without it; this was added the moment the last was fixed, so
      # there is nothing to allowlist and an exception would only mean a regression.
      - name: Loading-state aria check
        run: npm run check:loading-aria

      # Every shipped palette against WCAG AA, on the pairs a user actually reads: body and muted
      # text on both surfaces, a filled button's label at rest *and* on hover, and the 3:1
      # non-text pairs for field borders and the focus ring. Wired in once the last finding was
      # fixed (21.7.0) — deliberately not before, because a permanently red step over a known,
      # tracked condition teaches everyone to ignore CI. All 11 themes pass; a new preset that
      # does not is what this is here to stop.
      - name: Theme contrast check
        run: npm run check:contrast

      # The same bar for the docs site's *own* chrome — its header, both sidebars, search panel,
      # theme menu, footer and code blocks are hand-written CSS reading `--gog-*` tokens, and the
      # step above has never looked at a line of it. Eleven palettes a reader can switch between,
      # and until 2026-09-03 not one pair of it had ever been measured; the first run found the
      # sidebar's own hover label under AA. Reads node_modules on purpose, like the step below:
      # the lab renders with the *published* package, so that is the version its colours have to
      # be legible against. A release that changes a palette can therefore turn this red without
      # the lab changing — that is the point, and the fix belongs in the lab.
      - name: Lab contrast check
        run: npm run check:lab-contrast

      # The docs site serves `theme-starter.css` as the file a consumer copies wholesale, and it
      # opens by calling itself "every token the library paints with". Nothing enforced that, so
      # it had drifted to 714 of 1312 tokens with fifteen components missing entirely. The
      # component block is generated from the installed package now; this fails if it is stale or
      # if any token is unaccounted for. Note it reads node_modules, so it checks the *published*
      # package — which is the version the lab documents.
      - name: Theme starter completeness
        run: npm run check:theme-starter

      # The library must build standalone, before anything that consumes it.
      - name: Build @gleks/ui
        run: npm run build:lib

      - name: Test @gleks/ui
        run: npm run test:lib

      # Runs the same suite again with v8 coverage and the thresholds in angular.json's
      # `coverage` configuration. Kept separate from the step above so a failure here reads
      # as "coverage dropped", not "tests broke". Baseline and the reason the floor sits
      # where it does: docs/hardening-21.5.0.md, iteration 1.
      - name: Coverage @gleks/ui
        run: npm run test:lib:coverage

      # Catches breaking changes to the library's public API: the showcase is the
      # only real consumer, so a compile error here means a consumer-facing break.
      - name: Build ui-showcase
        run: npm run build:showcase
