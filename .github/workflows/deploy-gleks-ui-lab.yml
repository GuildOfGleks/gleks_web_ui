name: Deploy gleks-ui-lab

on:
  push:
    branches: [master]
    paths:
      - 'projects/gleks-ui-lab/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-gleks-ui-lab.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to tag and publish the image for'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

concurrency:
  group: deploy-gleks-ui-lab-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/balthazariy/gleks-ui-lab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Manual runs publish whichever environment was picked; a push to master always
    # publishes the production tag, since that is the branch's contract.
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        run: echo "tag=${{ github.event.inputs.environment || 'production' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/gleks-ui-lab/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to the home server ────────────────────────────────────────────
  # Disabled until the server is reachable from GitHub Actions (port-forwarding
  # or a DDNS hostname) and its SSH access is configured. To enable:
  #   1. In the repo's Settings → Secrets and variables → Actions, add:
  #        DEPLOY_HOST      - public hostname/IP of the home server
  #        DEPLOY_SSH_PORT  - SSH port (optional, defaults to 22)
  #        DEPLOY_SSH_USER  - SSH user allowed to run `docker`
  #        DEPLOY_SSH_KEY   - private key matching a public key in the
  #                           server's ~/.ssh/authorized_keys
  #   2. Either make the ghcr.io/balthazariy/gleks-ui-lab package public
  #      (Package settings → Change visibility) so the server can `docker pull`
  #      without credentials, or add a GHCR_PULL_TOKEN secret (a PAT with
  #      read:packages) and uncomment the `docker login` line below.
  #   3. Uncomment the whole job below.
  #   4. On the server, point nginx's reverse proxy for the relevant
  #      domain/subdomain at 127.0.0.1:4000 (production) or 127.0.0.1:4001
  #      (test) - matching the port mapping in the `docker run` command.
